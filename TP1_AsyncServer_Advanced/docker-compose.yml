version: '3.8'

services:

  # ─────────────────────────────────────────────────────────
  # InfluxDB 
  # ─────────────────────────────────────────────────────────
  influxdb:
    image: influxdb:1.8
    container_name: esp32_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: esp32_metrics
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
      INFLUXDB_DATA_QUERY_LOG_ENABLED: "false"
    volumes:
      - influxdb_data:/var/lib/influxdb

  # ─────────────────────────────────────────────────────────
  # Telegraf: lee /api/metrics
  # ─────────────────────────────────────────────────────────
  telegraf:
    image: telegraf:1.30
    container_name: esp32_telegraf
    restart: unless-stopped
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      - influxdb

  # ─────────────────────────────────────────────────────────
  # Prometheus
  # ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: esp32_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  # ─────────────────────────────────────────────────────────
  # Grafana con datasources: InfluxDB + Prometheus
  # ─────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.6.0
    container_name: esp32_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - influxdb
      - prometheus

volumes:
  influxdb_data:
  grafana_data:
